name=zeroNT
version=33.0
channel=beta-classic-no-flicker
kernel=real
paging=4-level
heap=high-half
block_device=ahci-sata
filesystem=fat32-native-read-write
safe_filesystem=journal+verify+backup+recovery
scheduler=round-robin-preemptive
process=user-ring3-syscall
audio=ac97-pcm
network=e1000
network_stack=ethernet-arp-ipv4-icmp-udp-dhcp-dns-tcp-probe
user_system=persistent-login-permissions
profile_path=C:\Users\<name>
system_apps=desktop,explorer,notepad,cmd,control,taskmgr,devmgr,recycle,services,eventviewer
ui_quality=window,mouse,explorer,notepad,messagebox
beta_monitor=enabled
event_log=/SYSTEM/EVENT.LOG
installer=integrated-first-boot
install_source=builtin-rootfs-template
install_target=ahci-sata
renderer=ram-backbuffer+dirty-present
